# Local development environment for ChurnOps.
#
# WHAT: Starts the four services that make up the running system:
#       the API, MLflow (tracking + registry), Prometheus, Grafana.
# WHY:  `docker compose up` should be enough for anyone (including
#       future you) to get the whole stack running without manually
#       starting four separate processes in four terminals.
# HOW:  docker compose up --build
#
# Note: training (`python -m src.train`) is run manually on the host,
# not as a compose service - training is a one-off command a developer
# runs when they have a new model to produce, not a long-running
# service.

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: churnops-mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --default-artifact-root mlflow-artifacts:/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: churnops-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_MODEL_NAME=churn-model
      - MLFLOW_MODEL_ALIAS=production
    depends_on:
      mlflow:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: churnops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: churnops-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mlflow_data:
  grafana_data:
