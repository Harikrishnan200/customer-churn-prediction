# ChurnOps Continuous Integration.
#
# WHAT: Runs automatically on every push/PR. Checks code quality
#       (Ruff), runs the test suite (pytest), and confirms the Docker
#       image still builds.
# WHY:  CI catches mistakes (broken code, failing tests, a broken
#       Dockerfile) before they reach anyone else, without a human
#       needing to remember to check manually.
#
# NOTE on CI vs CD: this workflow implements Continuous Integration
# only. Continuous Deployment (automatically shipping a new version to
# a real server after CI passes) is intentionally NOT implemented -
# there is no cloud target for this learning project to deploy to. See
# the README for a full explanation of what CD would add on top of this.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t churnops-api:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name churnops-api-ci -p 8000:8000 churnops-api:ci
          # Give uvicorn a moment to start before probing it.
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then
              echo "API is up"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          docker logs churnops-api-ci
          docker stop churnops-api-ci
