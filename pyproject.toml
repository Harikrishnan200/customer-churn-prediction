[project]
name = "churnops"
version = "0.1.0"
description = "ChurnOps - a beginner-friendly, production-style MLOps learning project"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep the rule set small and beginner-friendly:
# E/F = pyflakes/pycodestyle errors, I = import sorting.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
